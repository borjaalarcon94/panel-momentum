<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Momentum</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#14171c;--muted:#68707c;--line:#e3e6ea;--up:#0f8a4b;--down:#c62f2f;--warn:#9a6400;--warnbg:#fff4dc;--info:#2453b8;--infobg:#e8effd;--badbg:#fde9e9}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--text:#e8eaee;--muted:#9097a3;--line:#2a2e36;--up:#3ccf82;--down:#ff6b6b;--warn:#f0b54a;--warnbg:#3a2d12;--info:#86a8ff;--infobg:#1c2742;--badbg:#3d1d1d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.count{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tk{font-weight:700;font-size:17px;color:var(--text);text-decoration:none}
.name{color:var(--muted);font-size:13px;margin-top:1px}
.px{text-align:right;font-variant-numeric:tabular-nums}
.px b{font-size:17px}.up{color:var(--up)}.down{color:var(--down)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.m{font-size:12px;color:var(--muted)}.m span{display:block;font-size:14px;color:var(--text);font-variant-numeric:tabular-nums}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:12px;padding:3px 8px;border-radius:999px}
.tag.bad{background:var(--badbg);color:var(--down)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.info{background:var(--infobg);color:var(--info)}
.new{font-size:11px;font-weight:600;margin-left:6px;color:var(--info)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
footer{color:var(--muted);font-size:12px;margin-top:24px}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main>
<h1>Panel Momentum</h1>
<p class="sub">Acciones de EE. UU. que cumplen el filtro al cierre del día</p>
<div class="bar"><select id="dia" aria-label="Elegir día"></select><span class="count" id="count"></span></div>
<div id="lista"></div>
<footer>Filtro: precio &gt; 3 $ · sube en el día · capitalización &gt; 300 M $ · por encima de EMA 9 y EMA 50 · volumen medio 10 d &gt; 500.000 · ADR &gt; 7 % · RSI 14 &gt; 60. Datos de TradingView. Solo información, no es una recomendación.</footer>
</main>
<script>
const DIAS = /*DATOS*/null || {};
const fechas = Object.keys(DIAS).sort().reverse();
const sel = document.getElementById('dia');
const fmtFecha = f => new Date(f+'T12:00:00Z').toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
fechas.forEach(f=>{const o=document.createElement('option');o.value=f;o.textContent=fmtFecha(f);sel.appendChild(o)});
const n = (v,d=2)=> v==null?'—':Number(v).toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d});
const cap = v => v==null?'—':(v>=1e9?n(v/1e9,1)+' B':n(v/1e6,0)+' M');
function el(t,c,txt){const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
function pinta(f){
const lista=document.getElementById('lista');lista.replaceChildren();
const filas=DIAS[f]||[];
const prev=DIAS[fechas[fechas.indexOf(f)+1]]||null;
const antes=new Set((prev||[]).map(x=>x.ticker));
document.getElementById('count').textContent=filas.length+(filas.length===1?' acción':' acciones');
if(!filas.length){lista.appendChild(el('div','empty','Ese día ninguna acción cumplió el filtro.'));return}
const hoy=new Date(f+'T12:00:00Z');
filas.forEach(a=>{
const c=el('div','card');
const top=el('div','top');const izq=el('div');
const tk=el('a','tk',a.ticker);tk.href='https://www.tradingview.com/chart/?symbol='+encodeURIComponent(a.simbolo||a.ticker);tk.target='_blank';tk.rel='noopener';
izq.appendChild(tk);if(prev&&!antes.has(a.ticker))izq.appendChild(el('span','new','NUEVA'));
izq.appendChild(el('div','name',a.empresa||''));
const der=el('div','px');der.appendChild(el('b',null,n(a.precio)+' $'));
der.appendChild(el('div',a.cambio>=0?'up':'down',(a.cambio>=0?'+':'')+n(a.cambio)+' %'));
top.append(izq,der);c.appendChild(top);
const g=el('div','grid');
[['ADR',n(a.adr,1)+' %'],['RSI',n(a.rsi,0)],['Vol. relativo',n(a.volrel)],['Capitaliz.',cap(a.cap)]].forEach(([k,v])=>{const m=el('div','m',k);m.appendChild(el('span',null,v));g.appendChild(m)});
c.appendChild(g);
const tags=el('div','tags');
if(a.margen!=null&&a.margen<0)tags.appendChild(el('span','tag bad','Pierde dinero'));
if(a.ingresos!=null)tags.appendChild(el('span','tag '+(a.ingresos<0?'bad':'info'),'Ingresos '+(a.ingresos>=0?'+':'')+n(a.ingresos,0)+' % anual'));
if(a.resultados){const d=Math.round((new Date(a.resultados+'T12:00:00Z')-hoy)/864e5);if(d>=0&&d<=14)tags.appendChild(el('span','tag warn','Resultados en '+d+' días'))}
if(a.volrel>=1.5)tags.appendChild(el('span','tag info','Volumen alto'));
if(a.sector)tags.appendChild(el('span','tag info',a.sector));
c.appendChild(tags);lista.appendChild(c);
});
}
sel.addEventListener('change',()=>pinta(sel.value));
if(fechas.length)pinta(fechas[0]);else document.getElementById('lista').appendChild(el('div','empty','Aún no hay datos.'));
</script>
</body>
</html>
