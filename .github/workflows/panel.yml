name: Panel diario

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 23:30 en verano / 22:30 en invierno (hora de España), tras el cierre de EE. UU.
    # Repesca: si el de las 21:30 no guardo el cierre (fallo de red, datos raros, GitHub se salto el
    # cron), este lo reintenta. Los dias normales sale sin gastar NI UNA llamada, porque lo primero
    # que hace es mirar si el fichero de hoy ya existe.
    - cron: "30 23 * * 1-5"
    - cron: "0 7 * * 2-6"     # ultima red: a primera hora del dia siguiente
  workflow_dispatch:
  push:
    branches: [main]
    # Solo el código. Nunca docs/datos, docs/panel.json, docs/precios.json ni docs/index.html: los
    # escribe el propio bot y se dispararia en bucle.
    # Tienen que estar TODOS los ficheros que entran en el hash de version (docs/*.js y docs/*.css):
    # antes solo estaban puntuacion.js y reglas.js, asi que un arreglo en resultados.js o en un css
    # se subia sin republicar, la version no se movia y el navegador seguia sirviendo el fichero
    # viejo de su cache. Desde que un push usa --rehacer esto no cuesta ninguna llamada.
    paths: ["build.py", "puntuar.js", "plantilla.html", "docs/*.js", "docs/*.css", "tests/**", ".github/workflows/panel.yml"]

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4        # build.py puntúa con docs/puntuacion.js
        with:
          node-version: "20"
      # Pruebas de LOGICA PURA: no dependen de los datos del dia, asi que si fallan es que el codigo
      # esta mal y no se publica nada. Esto si bloquea.
      - name: Reglas y puntuacion (bloquean)
        run: |
          node tests/reglas.test.js
          node tests/puntuacion.test.js
          node tests/integridad.test.js
          node tests/resultados.test.js
          python3 tests/filtros.test.py

      # El test de humo SI depende de los datos del dia. El 21/10/2026 fallo por un empate de orden
      # en el seguimiento y bloqueo la publicacion: el panel se quedo dos dias sin actualizar.
      # En la ejecucion diaria el CODIGO NO HA CAMBIADO, asi que un fallo aqui solo puede venir de los
      # datos, y congelar los datos no arregla nada: deja el panel viejo, que es peor. Se ejecuta,
      # NO bloquea la publicacion, y al final se marca el trabajo en rojo para que llegue el aviso.
      - name: Humo sobre los datos de hoy (avisa, no bloquea en el diario)
        id: humo
        continue-on-error: ${{ github.event_name == 'schedule' }}
        run: node tests/humo.test.js

      # Tres modos, y solo uno gasta llamadas a TradingView:
      #  - push de codigo: --rehacer. Republica con los datos ya guardados, CERO llamadas. Antes un
      #    cambio de interfaz disparaba un escaneo entero y se comia el presupuesto de 4/dia, o
      #    habia que esperar a la noche para ver el arreglo publicado.
      #  - repesca (23:30 / 07:00): --solo-si-falta. Sale antes de escanear si ya hay cierre de hoy.
      #  - diario (21:30): build completo. Este es el que gasta.
      - name: Construir el panel
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python build.py --rehacer
          elif [ "${{ github.event.schedule }}" = "30 23 * * 1-5" ] || [ "${{ github.event.schedule }}" = "0 7 * * 2-6" ]; then
            python build.py --solo-si-falta
          else
            python build.py
          fi
      - name: Guardar resultados
        run: |
          git config user.name "panel-bot"
          git config user.email "panel-bot@users.noreply.github.com"
          git add -A docs
          git commit -m "Datos $(date -u +%F)" || echo "Sin cambios"
          git push

      # Si el humo fallo, los datos ya estan publicados pero el trabajo acaba en rojo: llega el correo
      # de GitHub y queda registro, en vez de un fallo silencioso.
      - name: Marcar el fallo del humo, ya con los datos publicados
        if: steps.humo.outcome == 'failure'
        run: |
          echo "::error::El test de humo ha fallado. Los datos SI se han publicado; revisa el panel."
          exit 1
