name: Panel diario

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 23:30 en verano / 22:30 en invierno (hora de España), tras el cierre de EE. UU.
  workflow_dispatch:
  push:
    branches: [main]
    # Solo el código. Nunca docs/datos ni docs/panel.json: el propio bot los escribe y se dispararía en bucle.
    paths: ["build.py", "puntuar.js", "plantilla.html", "docs/puntuacion.js", "docs/reglas.js", "tests/**", ".github/workflows/panel.yml"]

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4        # build.py puntúa con docs/puntuacion.js
        with:
          node-version: "20"
      # Pruebas de LOGICA PURA: no dependen de los datos del dia, asi que si fallan es que el codigo
      # esta mal y no se publica nada. Esto si bloquea.
      - name: Reglas y puntuacion (bloquean)
        run: |
          node tests/reglas.test.js
          node tests/puntuacion.test.js
          node tests/integridad.test.js
          python3 tests/filtros.test.py

      # El test de humo SI depende de los datos del dia. El 21/10/2026 fallo por un empate de orden
      # en el seguimiento y bloqueo la publicacion: el panel se quedo dos dias sin actualizar.
      # En la ejecucion diaria el CODIGO NO HA CAMBIADO, asi que un fallo aqui solo puede venir de los
      # datos, y congelar los datos no arregla nada: deja el panel viejo, que es peor. Se ejecuta,
      # NO bloquea la publicacion, y al final se marca el trabajo en rojo para que llegue el aviso.
      - name: Humo sobre los datos de hoy (avisa, no bloquea en el diario)
        id: humo
        continue-on-error: ${{ github.event_name == 'schedule' }}
        run: node tests/humo.test.js

      - run: python build.py
      - name: Guardar resultados
        run: |
          git config user.name "panel-bot"
          git config user.email "panel-bot@users.noreply.github.com"
          git add -A docs
          git commit -m "Datos $(date -u +%F)" || echo "Sin cambios"
          git push

      # Si el humo fallo, los datos ya estan publicados pero el trabajo acaba en rojo: llega el correo
      # de GitHub y queda registro, en vez de un fallo silencioso.
      - name: Marcar el fallo del humo, ya con los datos publicados
        if: steps.humo.outcome == 'failure'
        run: |
          echo "::error::El test de humo ha fallado. Los datos SI se han publicado; revisa el panel."
          exit 1
